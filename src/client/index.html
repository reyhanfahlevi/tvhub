<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tvhub — Apple tvOS Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              apple: {
                dark: "#0b0c10",
                panel: "rgba(22, 24, 32, 0.72)",
                glass: "rgba(255, 255, 255, 0.05)",
                border: "rgba(255, 255, 255, 0.1)",
                blue: "#2997ff",
                cyan: "#00d2ff"
              }
            },
            fontFamily: {
              sans: ["'Plus Jakarta Sans'", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
              mono: ["'JetBrains Mono'", "monospace"]
            }
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background-color: #07080d;
        color: #f5f5f7;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Apple Glass Panel */
      .apple-glass {
        background: rgba(18, 20, 29, 0.68);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .apple-glass-card {
        background: rgba(28, 31, 44, 0.5);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .apple-glass-card:hover {
        background: rgba(36, 40, 58, 0.65);
        border-color: rgba(255, 255, 255, 0.16);
        transform: translateY(-2px);
      }
      /* Siri Remote Brushed Aluminum / Space Black */
      .siri-remote-chassis {
        background: linear-gradient(165deg, #262832 0%, #15161d 50%, #0d0e13 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.25), inset 0 -1px 2px rgba(0, 0, 0, 0.8);
      }
      .clickpad-outer {
        background: radial-gradient(circle at 50% 40%, #2f3240 0%, #1c1e28 75%, #151620 100%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.5);
      }
      .clickpad-center {
        background: radial-gradient(circle at 45% 40%, #3e4254 0%, #222430 75%, #171822 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      }
      .clickpad-center:active {
        transform: scale(0.96);
        background: #151620;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
      }
      .siri-button {
        background: linear-gradient(180deg, #2a2d3b 0%, #181a24 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        transition: all 0.1s ease;
      }
      .siri-button:active {
        transform: translateY(1px) scale(0.96);
        background: #11121a;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      }
      /* TV Bezel Mockup */
      .tv-bezel {
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.9), 0 0 40px rgba(41, 151, 255, 0.12);
      }
      /* Clean subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body class="min-h-screen relative overflow-x-hidden">
    <!-- Ambient Background Lighting -->
    <div class="fixed inset-0 pointer-events-none z-0">
      <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-[140px]"></div>
      <div class="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-indigo-600/10 rounded-full blur-[160px]"></div>
      <div class="absolute -bottom-40 left-1/3 w-[36rem] h-[36rem] bg-cyan-600/10 rounded-full blur-[180px]"></div>
    </div>
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
